<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja roupa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <header>
        <h1>👕Loja de Roupas👚</h1>
    </header>
    
    <main class="area-contato">
        
        <form class="formulario">
            <h2>Fale com a gente</h2>
            <label for="nome">Nome:</label><br><br>
            <input type="text" id="nome" placeholder="Digite seu nome" required minlength="3"><br><br>
            <label for="email">E-mail</label><br><br>
            <input type="email" id="email" placeholder="seu@email.com" required><br><br>
            <label for="telefone">Telefone</label><br><br>
            <input type="tel" id="telefone" placeholder="(51) 99999-9999"><br><br>
            <label for="nascimento">Data de nasimento</label><br><br>
            <input type="date" id="nascimento" required><br><br>
            <label for="tamanho">Tamanho (numero de 34 a 46)</label><br><br>
            <input type="number" id="tamanho" min="34" max="46" step="2" placeholder="ex: 38"><br><br>
            <label for="produto">Produto de interesse</label>
            <select id="produto" required>
                <option value="">Escolha seu produto</option>
                <option value="camiseta">Camiseta</option>
                <option value="calça">Calça</option>
                <option value="jaqueta">Jaqueta</option>
                <option value="Vestido">Vestido</option>
            </select>
            <fieldset>
                <legend>Forma de contato preferida</legend>
                <label><input type="radio" nome="contato" value="email" checked>email</label>
                <label><input type="radio" nome="contato" value="telefone">Telefone</label>
                <label><input type="radio" nome="contato" value="whatsapp">whatsapp</label>
            </fieldset>
            <fieldset>
                <legend>Interesse</legend>
                <label><input type="checkbox" nome="interesse" value="promocoes">promoções</label>
                <label><input type="checkbox" nome="interesse" value="novidades">Novidades</label>
                <label><input type="checkbox" nome="interesse" value="eventos">Eventos</label>
            </fieldset>
            <label for="mensagem">Mensagem</label>
            <textarea name="mensagem" id="mensagem" placeholder="Escreva sua duvida" maxlength="200"></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>

</body>
</html>
