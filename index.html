<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja roupa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <header>
        <h1>👕Loja de Roupas👚</h1>
    </header>
    <main class="carrosel">

        <div class="trilho">
            
            <div class="slide">
                <img src="/IMG/camisa.webp" alt="Camisa azul">
                <h2>Camiseta</h2>
                <p class="preço">R$ 49,90</p>
            </div>
            <div class="slide">
                <img src="/IMG/calça.webp" alt="Calça jeans">
                <h2>Calça</h2>
                <p class="preço">R$ 65,50</p>
            </div>
            <div class="slide">
                <img src="/IMG/jaqueta.webp" alt="Jaqueta">
                <h2>Jaqueta</h2>
                <p class="Preço">R$ 70,99</p>
            </div>
            <div class="slide">
                <img src="/IMG/tenis.webp" alt="Tênis esportivo">
                <h2>Tênis</h2>
                <p class="preço">R$159,99</p>
            </div>
            <div class="slide">
                <img src="/IMG/vestido.webp" alt="Vestido">
                <h2>Vestido lindinho do amorzinho</h2>
                <p class="Preço">R$ 80,00</p>
            </div>
        </div>
    </main>

</body>
</html>
